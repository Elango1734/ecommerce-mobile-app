name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Only the JS layer is checked here. Building the iOS app needs a macOS
      # runner, Xcode and CocoaPods; that is a slower, separate job worth adding
      # when there is something to release.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
